[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "license-compat-check"
version = "0.1.0"
description = "Catch common dependency license conflicts using a small explainable policy file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zchstime" }]
keywords = ['license', 'spdx', 'compliance', 'dependencies', 'open-source', 'devsecops']
[project.scripts]
license-check = "license_compat_check.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
